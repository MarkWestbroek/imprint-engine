# Local dev database — same MariaDB major as the Plesk production server
# (10.11), so migrations behave identically. Start with: npm run db:up
services:
  db:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: imprint-root
      MARIADB_DATABASE: musicbrain
      MARIADB_USER: imprint
      MARIADB_PASSWORD: imprint-dev
    volumes:
      - db-data:/var/lib/mysql
    # Zo weet 'docker compose up -d --wait' (npm run db:up) dat MariaDB écht
    # klaar is, zodat db:migrate er direct achteraan kan zonder race.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "imprint", "-pimprint-dev", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db-data:
