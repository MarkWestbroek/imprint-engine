# Lokale dev-databases — start met: npm run db:up
#  - db: MariaDB 10.11 (MusicBrain; zelfde major als de vorige Plesk-hosting)
#  - pg: Postgres 17 (Imprint-productsite; de tweede backend achter ContentStore)
# Poort 5434 op de host: 5432 en 5433 zijn lokaal vaak al bezet door
# Omnium/Bitemporal (register en regressietest).
# restart: unless-stopped = beide starten vanzelf mee met Docker, tot je ze
# zelf stopt (docker compose stop).
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: imprint-root
      MARIADB_DATABASE: musicbrain
      MARIADB_USER: imprint
      MARIADB_PASSWORD: imprint-dev
    volumes:
      - db-data:/var/lib/mysql
    # Zo weet 'docker compose up -d --wait' (npm run db:up) dat MariaDB écht
    # klaar is, zodat db:migrate er direct achteraan kan zonder race.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "imprint", "-pimprint-dev", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  pg:
    image: postgres:17.5
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: imprint
      POSTGRES_PASSWORD: imprint-dev
      POSTGRES_DB: imprint
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Maakt eenmalig de testdatabase imprint_test aan (npm run test:db).
      - ./docker/pg-init.sql:/docker-entrypoint-initdb.d/10-imprint-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imprint -d imprint"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  db-data:
  pg-data:
