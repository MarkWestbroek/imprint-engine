# CI — build + lint + typecheck bij elke push/PR (backlog §6); bij alleen
# docs/deploy-wijzigingen alleen de snelle controle van de deploybestanden.
# Bouwt zonder DATABASE_URL: de site valt dan terug op de file-store (v0),
# dus de SSG-build draait tegen de content in git — geen database nodig.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Wat is er veranderd? Alleen docs of deploybestanden: dan zijn bouwen en
  # browsertests (samen ~6 minuten) overbodig en slaan we ze over.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!doc/**'
              - '!**/*.md'
              - '!deploy/**'

  # Snel (seconden) en altijd: de deploybestanden van de VPS. Fouten hierin
  # vallen anders pas op bij het uitrollen.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose.yml geldig
        run: |
          # Elke ${VAR} de dummywaarde 1 (ook geldig als poort): hier gaat het om de structuur, niet om geheimen.
          grep -oE '\$\{[A-Z_0-9]+' deploy/vps/compose.yml | cut -c3- | sort -u | sed 's/$/=1/' > "$RUNNER_TEMP/ci.env"
          docker compose -f deploy/vps/compose.yml --env-file "$RUNNER_TEMP/ci.env" config --quiet
      - name: Shellscripts parsen
        run: for f in deploy/vps/*.sh; do bash -n "$f"; done

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (karakterisatie; DB-suite wordt zonder TEST_DATABASE_URL overgeslagen)
        run: npm test

      - name: Build (file-store, geen DB)
        run: npm run build

  # Browsertests van de admin (ontwerp Fase 3, stap 2). Aparte job: deze heeft
  # een database en een browser nodig, `verify` hierboven blijft snel.
  # Twee keer dezelfde specs: tegen de productiebuild (wat bezoekers krijgen) en
  # tegen `next dev` (alleen daar meldt React hydration- en propfouten).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.11
        ports: ["3306:3306"]
        env:
          MARIADB_ROOT_PASSWORD: imprint-root
          MARIADB_DATABASE: imprint_e2e
          MARIADB_USER: imprint
          MARIADB_PASSWORD: imprint-dev
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uimprint -pimprint-dev --silent"
          --health-interval=3s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browsertests (productiebuild)
        run: npm run test:e2e

      - name: Browsertests (next dev)
        run: npm run test:e2e:dev

      - name: Bewaar traces bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            sites/musicbrain/test-results/
            sites/musicbrain/playwright-report/
          retention-days: 7
