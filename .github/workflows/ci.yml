# CI — typecheck, lint, tests en build bij elke push/PR (backlog §6), alleen voor
# wat er veranderd is en per site naast elkaar. Dezelfde keuze maakt
# `npm run verify` lokaal (scripts/verify.mjs): een wijziging in packages/ of in
# de package-bestanden van de root raakt elke site, een wijziging in
# sites/<naam>/ alleen die site; docs en deploybestanden raken geen site.
# Bouwt zonder DATABASE_URL: de site valt dan terug op de file-store (v0),
# dus de SSG-build draait tegen de content in git — geen database nodig.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Een nieuwe push op dezelfde PR maakt de vorige run overbodig.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Wat moet er gecontroleerd worden? scripts/verify.mjs --list --json, tegen de
  # basis van de PR (of de vorige stand van main bij een push).
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      sites: ${{ steps.plan.outputs.sites }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # Een nieuwe branch of een force-push heeft geen bruikbare vorige stand: dan alles.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            plan=$(node scripts/verify.mjs --list --json --base="$BASE")
          else
            plan=$(node scripts/verify.mjs --list --json --all)
          fi
          echo "$plan"
          {
            echo "packages=$(echo "$plan" | jq -c .packages)"
            echo "sites=$(echo "$plan" | jq -c .sites)"
            echo "e2e=$(echo "$plan" | jq -c .e2e)"
          } >> "$GITHUB_OUTPUT"

  # Snel (seconden) en altijd: de deploybestanden van de VPS. Fouten hierin
  # vallen anders pas op bij het uitrollen.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose.yml geldig
        run: |
          # Elke ${VAR} de dummywaarde 1 (ook geldig als poort): hier gaat het om de structuur, niet om geheimen.
          grep -oE '\$\{[A-Z_0-9]+' deploy/vps/compose.yml | cut -c3- | sort -u | sed 's/$/=1/' > "$RUNNER_TEMP/ci.env"
          docker compose -f deploy/vps/compose.yml --env-file "$RUNNER_TEMP/ci.env" config --quiet
      - name: Shellscripts parsen
        run: for f in deploy/vps/*.sh; do bash -n "$f"; done

  # De engine: de pakketgrenzen, en typecheck, lint en tests van elk package.
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Packages (grenzen, typecheck, lint, test)
        run: node scripts/verify.mjs --packages

  # Per geraakte site, naast elkaar: typecheck, lint, test en build. De
  # Next-cache van de vorige run maakt de build sneller.
  site:
    needs: changes
    if: needs.changes.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    name: site (${{ matrix.site }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - uses: actions/cache@v4
        with:
          path: sites/${{ matrix.site }}/.next/cache
          key: next-${{ matrix.site }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ matrix.site }}-${{ hashFiles('package-lock.json') }}-
      - name: ${{ matrix.site }} (typecheck, lint, test, build)
        run: node scripts/verify.mjs --site=${{ matrix.site }}

  # Browsertests van de admin (ontwerp Fase 3, stap 2), via MusicBrain: alleen
  # als de engine of MusicBrain veranderd is. Twee keer dezelfde specs: tegen de
  # productiebuild (wat bezoekers krijgen) en tegen `next dev` (alleen daar
  # meldt React hydration- en propfouten).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.11
        ports: ["3306:3306"]
        env:
          MARIADB_ROOT_PASSWORD: imprint-root
          MARIADB_DATABASE: imprint_e2e
          MARIADB_USER: imprint
          MARIADB_PASSWORD: imprint-dev
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uimprint -pimprint-dev --silent"
          --health-interval=3s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # De browser zelf uit de cache (de versie hangt aan package-lock); de
      # systeembibliotheken komen altijd uit apt.
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium-systeembibliotheken
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browsertests (productiebuild)
        run: npm run test:e2e

      - name: Browsertests (next dev)
        run: npm run test:e2e:dev

      - name: Bewaar traces bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            sites/musicbrain/test-results/
            sites/musicbrain/playwright-report/
          retention-days: 7
