<!-- case: unit -->
<section class="rounded-xl border border-line bg-surface p-5">
<h2 class="eyebrow mb-3">Assembling</h2>
<figure class="m-0">
<div class="relative overflow-hidden rounded-xl border border-line bg-surface">
<div class="w-full" style="aspect-ratio:16 / 9">
</div>
<p class="pointer-events-none absolute left-3 top-3 rounded bg-background/80 px-2 py-1 font-mono text-xs text-muted">Loading…</p>
</div>
<div class="mt-2 flex flex-wrap items-center gap-3 text-sm">
<button type="button" class="rounded-md border border-line px-3 py-1 font-semibold hover:border-accent" aria-label="Pause">Pause</button>
<input type="range" min="0" max="1000" class="min-w-[8rem] flex-1 accent-[var(--accent)]" aria-label="Timeline" value="0"/>
<span class="font-mono text-xs text-muted">0<!-- -->s / <!-- -->24<!-- -->s</span>
<button type="button" class="text-xs text-muted underline underline-offset-4 hover:text-foreground">Reset view</button>
</div>
<figcaption class="mt-1 text-sm text-muted">Drag to look around.</figcaption>
</figure>
</section>
