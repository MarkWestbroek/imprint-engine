# compose.yml — Imprint op de VPS (vps1.paratmos.nl), achter Caddy op de host.
#
# Zelfde patroon als Omnium (/srv/omnium): geen container publiceert een poort
# op het publieke IP. Elke site luistert op een loopback-poort; Caddy zet er
# HTTPS voor (Caddyfile.snippet). Postgres alleen op loopback: voor de
# SSG-build, backups en een SSH-tunnel.
#
#   musicbrain → 127.0.0.1:3000      imprint → 127.0.0.1:3100
#   commonground → 127.0.0.1:3400    (showcase; 3200/3300: volksgebouw/psycholog)
#   postgres   → 127.0.0.1:5434      (Omnium gebruikt 5433)
#   minio      → alleen imprint_net (API :9000); console 127.0.0.1:9011
#
# Eén Postgres, per imprint een eigen database + rol (pg-init.sh). Eén image
# per site uit dezelfde Dockerfile (build-arg SITE). De build leest de database
# (SSG) via een BuildKit-secret en `network: host`; daarom bouwen we hier op de
# VPS en niet in CI. Alles loopt via ./deploy.sh — zie docs/deploy-vps.md.

name: imprint

x-site: &site
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [imprint_net]

services:

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.5}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt in .env}
      MUSICBRAIN_DB_PASSWORD: ${MUSICBRAIN_DB_PASSWORD:?MUSICBRAIN_DB_PASSWORD ontbreekt in .env}
      IMPRINT_DB_PASSWORD: ${IMPRINT_DB_PASSWORD:?IMPRINT_DB_PASSWORD ontbreekt in .env}
      # Leeg mag: dan maakt pg-init.sh die database niet aan (bestaand volume: zie docs/deploy-vps.md).
      COMMONGROUND_DB_PASSWORD: ${COMMONGROUND_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg-init.sh:/docker-entrypoint-initdb.d/10-imprint-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [imprint_net]

  # Eigen MinIO voor de bestanden van de sites (design/beeldbibliotheek.md §8):
  # per site een bucket met een gebruiker die alleen die bucket mag
  # (deploy.sh s3-setup). Los van de MinIO's van bitemporal/Omnium, zodat hun
  # upgrades de sites niet raken. De API is alleen in imprint_net bereikbaar
  # (http://minio:9000); de console via een SSH-tunnel naar 127.0.0.1:9011.
  # Start alleen als een site een S3-endpoint heeft (deploy.sh).
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-imprint-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [imprint_net]

  musicbrain:
    <<: *site
    image: imprint/musicbrain:${MUSICBRAIN_TAG:-latest}
    build:
      context: ../..
      args: { SITE: musicbrain, BUILD_ID: "${BUILD_ID:-dev}" }
      network: host
      secrets: [database_url]
    environment:
      DATABASE_URL: postgres://musicbrain:${MUSICBRAIN_DB_PASSWORD}@postgres:5432/musicbrain
      SESSION_SECRET: ${MUSICBRAIN_SESSION_SECRET:?MUSICBRAIN_SESSION_SECRET ontbreekt in .env}
      INGEST_TOKEN: ${MUSICBRAIN_INGEST_TOKEN:-}
      # Extra origins for /api/media and /api/patches next to editor.musicbrain.nl (comma-separated; e.g. the editor's dev server).
      MEDIA_CORS_ORIGINS: ${MUSICBRAIN_MEDIA_CORS_ORIGINS:-}
      GITHUB_WEBHOOK_SECRET: ${MUSICBRAIN_GITHUB_WEBHOOK_SECRET:-}
      # Eigen MinIO-bucket (design/beeldbibliotheek.md §8); leeg = assets op het volume hieronder.
      ASSET_S3_ENDPOINT: ${MUSICBRAIN_S3_ENDPOINT:-}
      ASSET_S3_BUCKET: ${MUSICBRAIN_S3_BUCKET:-}
      ASSET_S3_ACCESS_KEY: ${MUSICBRAIN_S3_ACCESS_KEY:-}
      ASSET_S3_SECRET_KEY: ${MUSICBRAIN_S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${MUSICBRAIN_PORT:-3000}:3000"
    volumes:
      - musicbrain_assets:/data/assets

  imprint:
    <<: *site
    image: imprint/imprint:${IMPRINT_TAG:-latest}
    build:
      context: ../..
      args: { SITE: imprint, BUILD_ID: "${BUILD_ID:-dev}" }
      network: host
      secrets: [database_url]
    environment:
      DATABASE_URL: postgres://imprint:${IMPRINT_DB_PASSWORD}@postgres:5432/imprint
      SESSION_SECRET: ${IMPRINT_SESSION_SECRET:?IMPRINT_SESSION_SECRET ontbreekt in .env}
      INGEST_TOKEN: ${IMPRINT_INGEST_TOKEN:-}
      # Eigen MinIO-bucket (design/beeldbibliotheek.md §8); leeg = assets op het volume hieronder.
      ASSET_S3_ENDPOINT: ${IMPRINT_S3_ENDPOINT:-}
      ASSET_S3_BUCKET: ${IMPRINT_S3_BUCKET:-}
      ASSET_S3_ACCESS_KEY: ${IMPRINT_S3_ACCESS_KEY:-}
      ASSET_S3_SECRET_KEY: ${IMPRINT_S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${IMPRINT_PORT:-3100}:3000"
    volumes:
      - imprint_assets:/data/assets

  # Showcase: Common Ground op Imprint (design/communities.md). Pagina's uit
  # Pleio via `./deploy.sh import-pleio commonground`; plaatjes linken nog naar
  # commonground.nl, dus geen bucket nodig.
  commonground:
    <<: *site
    image: imprint/commonground:${COMMONGROUND_TAG:-latest}
    build:
      context: ../..
      args: { SITE: commonground, BUILD_ID: "${BUILD_ID:-dev}" }
      network: host
      secrets: [database_url]
    environment:
      DATABASE_URL: postgres://commonground:${COMMONGROUND_DB_PASSWORD}@postgres:5432/commonground
      SESSION_SECRET: ${COMMONGROUND_SESSION_SECRET:-}
      ASSET_ROOT: /data/assets
      # Members' verification mail (design/mail.md); empty = no mail.
      SMTP_HOST: ${COMMONGROUND_SMTP_HOST:-}
      SMTP_PORT: ${COMMONGROUND_SMTP_PORT:-465}
      SMTP_USER: ${COMMONGROUND_SMTP_USER:-}
      SMTP_PASS: ${COMMONGROUND_SMTP_PASS:-}
      MAIL_FROM: ${COMMONGROUND_MAIL_FROM:-}
      # The scheduled digest (deploy.sh digest commonground) authenticates with this.
      INGEST_TOKEN: ${COMMONGROUND_INGEST_TOKEN:-}
    ports:
      - "127.0.0.1:${COMMONGROUND_PORT:-3400}:3000"
    volumes:
      - commonground_assets:/data/assets

  # Werkboom + devDependencies: migraties, seed en gebruikersbeheer tegen de
  # productiedatabase. Draait alleen op verzoek:
  #   docker compose run --rm -e DATABASE_URL=… tools npm run db:migrate:pg
  tools:
    image: imprint/tools:latest
    profiles: ["tools"]
    build:
      context: ../..
      target: tools
    depends_on:
      postgres:
        condition: service_healthy
    networks: [imprint_net]

secrets:
  # Alleen tijdens de build, en via loopback (build.network: host) — niet de
  # servicenaam `postgres`, want het compose-netwerk bestaat tijdens een build
  # niet. deploy.sh zet BUILD_DATABASE_URL per site, vlak voor diens build.
  database_url:
    environment: BUILD_DATABASE_URL

volumes:
  minio_data:
  pg_data:
  musicbrain_assets:
  imprint_assets:
  commonground_assets:

networks:
  imprint_net:
    driver: bridge
