apiVersion: batch/v1
kind: Job
metadata:
  name: imprint-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: imprint-tools # overlay: images
          command: [npm, run, db:migrate:pg]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: imprint-env, key: DATABASE_URL } }
            - { name: HOME, value: /tmp }
            - { name: npm_config_cache, value: /tmp/.npm }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
