# sites/inrichting op Fundament (cluster common-ground, sinds 13-11-2026): de inrichtings-UI op het
# Omnium-register (docs/design/omnium-inrichting.md). Werktitels; de
# namespace, de database en de hostnaam in het certificaat regelt FUNDAMENT.
#   kubectl apply -k deploy/k8s/inrichting
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tnt-cg--inrichting
resources:
  - ../base
images:
  - { name: imprint-site, newName: docker.io/markwestbroek/imprint-inrichting, newTag: "0.15.0-8dac4b3" }
configMapGenerator:
  - name: imprint-config
    options: { disableNameSuffixHash: true }
    literals:
      # Het register binnen het cluster, geen omweg via de gateway; /full/…
      # direct onder de root, /api/… voor auth, render en volgorde.
      - OMNIUM_REGISTER_URL=http://omnium-api.tnt-cg--omnium.svc.cluster.local:8080
      # Render-API (v3model, Studio-diagrammen)
      - OMNIUM_URL=http://omnium-render-svc.tnt-cg--omnium.svc.cluster.local:8095
patches:
  # Leestoken van het register (rol lezer, max. 365 dagen geldig): een eigen
  # Secret, aangemaakt bij het uitrollen (FUNDAMENT/INRICHTEN_VIZ), zodat
  # vernieuwen los staat van de rest van imprint-env.
  - target: { kind: Deployment, name: imprint }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OMNIUM_REGISTER_TOKEN
          valueFrom: { secretKeyRef: { name: omnium-lezer, key: OMNIUM_REGISTER_TOKEN } }
      # Schrijftoken (account omnium-schrijver, rol modelleur, schrijven op Inrichten): de
      # werkplaats slaat het formulier op in de branch van de dienstversie (Fase B, laag 2).
      # Eigen Secret, los van het leestoken (afspraak FUNDAMENT/BACKEND 10-11); optional,
      # zodat de site zonder hem gewoon alleen-lezen draait. Alleen de schrijfmodule
      # (plugin-omnium/studio-client) leest hem, server-side.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OMNIUM_SCHRIJF_TOKEN
          valueFrom: { secretKeyRef: { name: omnium-schrijver, key: OMNIUM_SCHRIJF_TOKEN, optional: true } }
      # Koppelingen schrijven (omgevingswizard stap 5, Fundament §9): het token van het register-account
      # met rol bouwer, alleen aan de serverkant. Ontbreekt de Secret `omnium-koppelaar`, dan kan niemand
      # lijnen leggen en blijft de wizard alleen-lezen.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OMNIUM_KOPPELING_TOKEN
          valueFrom: { secretKeyRef: { name: omnium-koppelaar, key: OMNIUM_KOPPELING_TOKEN, optional: true } }
      # Omgevingswizard (Fundament docs/inrichtingstool-als-plugin.md §4): de live scan van de
      # plugin (v0.6.0) via Secret `inrichting-scan` (url + token, aangemaakt door de plugin).
      # Als terugval een opgenomen scan uit de ConfigMap `scan-opname` (key scan.json). Die staat
      # alleen in het cluster, niet in git: hij bevat de hostnamen van het lab. Ontbreken beide,
      # dan toont de wizard een voorbeeld uit het register.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SCAN_URL
          valueFrom: { secretKeyRef: { name: inrichting-scan, key: url, optional: true } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SCAN_TOKEN
          valueFrom: { secretKeyRef: { name: inrichting-scan, key: token, optional: true } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SCAN_OPNAME, value: /etc/imprint/scan/scan.json }
      - op: add
        path: /spec/template/spec/volumes
        value: [{ name: scan-opname, configMap: { name: scan-opname, optional: true } }]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{ name: scan-opname, mountPath: /etc/imprint/scan, readOnly: true }]
  - target: { kind: HTTPRoute, name: imprint }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: [inrichting.fundament.common-ground-lab.nl]
