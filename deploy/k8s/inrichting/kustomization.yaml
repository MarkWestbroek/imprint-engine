# sites/inrichting op Fundament (cg-test): de inrichtings-UI op het
# Omnium-register (docs/design/omnium-inrichting.md). Werktitels; de
# namespace, de database en de hostnaam in het certificaat regelt FUNDAMENT.
#   kubectl apply -k deploy/k8s/inrichting
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tnt-cg--inrichting
resources:
  - ../base
images:
  - { name: imprint-site, newName: docker.io/markwestbroek/imprint-inrichting, newTag: "0.15.0-cf280c0" }
configMapGenerator:
  - name: imprint-config
    options: { disableNameSuffixHash: true }
    literals:
      # Het register binnen het cluster, geen omweg via de gateway; /full/…
      # direct onder de root, /api/… voor auth, render en volgorde.
      - OMNIUM_REGISTER_URL=http://omnium-api.tnt-cg--omnium.svc.cluster.local:8080
      # Render-API (v3model, Studio-diagrammen)
      - OMNIUM_URL=http://omnium-render-svc.tnt-cg--omnium.svc.cluster.local:8095
patches:
  # Leestoken van het register (rol lezer, max. 365 dagen geldig): een eigen
  # Secret, aangemaakt bij het uitrollen (FUNDAMENT/INRICHTEN_VIZ), zodat
  # vernieuwen los staat van de rest van imprint-env.
  - target: { kind: Deployment, name: imprint }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OMNIUM_REGISTER_TOKEN
          valueFrom: { secretKeyRef: { name: omnium-lezer, key: OMNIUM_REGISTER_TOKEN } }
      # Schrijftoken (account omnium-schrijver, rol modelleur, schrijven op Inrichten): de
      # werkplaats slaat het formulier op in de branch van de dienstversie (Fase B, laag 2).
      # Eigen Secret, los van het leestoken (afspraak FUNDAMENT/BACKEND 10-11); optional,
      # zodat de site zonder hem gewoon alleen-lezen draait. Alleen de schrijfmodule
      # (plugin-omnium/studio-client) leest hem, server-side.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OMNIUM_SCHRIJF_TOKEN
          valueFrom: { secretKeyRef: { name: omnium-schrijver, key: OMNIUM_SCHRIJF_TOKEN, optional: true } }
  - target: { kind: HTTPRoute, name: imprint }
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: [inrichting.fundament.common-ground-lab.nl]
